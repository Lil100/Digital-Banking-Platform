<div class="transfer-form">
    <h2>Transfer Funds</h2>
    <form [formGroup]="transferForm" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Target Account Number</label>
        <input type="text" formControlName="targetAccount" class="form-control" placeholder="Enter account number" />
        <div *ngIf="transferForm.get('targetAccount')?.invalid && transferForm.get('targetAccount')?.touched" class="text-danger">
          Target account is required.
        </div>
      </div>
      <div class="form-group">
        <label>Amount</label>
        <input type="number" formControlName="amount" class="form-control" placeholder="Enter amount" />
        <div *ngIf="transferForm.get('amount')?.invalid && transferForm.get('amount')?.touched" class="text-danger">
          Please enter a valid amount.
        </div>
      </div>
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-paper-plane"></i> Transfer
      </button>
    </form>
  </div>
