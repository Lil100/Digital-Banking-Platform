<div class="statement-container">
    <h2>Mini-Statement</h2>
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let tx of transactions">
          <td>{{ tx.date | date:'short' }}</td>
          <td>{{ tx.type }}</td>
          <td>{{ tx.amount | currency }}</td>
          <td>{{ tx.status }}</td>
        </tr>
      </tbody>
    </table>
  </div>
