<div class="statement-container container">
  <h2 class="mb-4">
    <i class="fas fa-file-invoice-dollar"></i> Mini-Statement
  </h2>
  
  <!-- Filter Form -->
  <form (ngSubmit)="onFilterSubmit()" class="form-inline mb-4">
    <div class="form-group mr-3">
      <label for="accountSelect" class="mr-2">
        <i class="fas fa-credit-card"></i> Account
      </label>
      <select id="accountSelect" class="form-control" [(ngModel)]="selectedAccountId" name="accountSelect" required>
        <option *ngFor="let account of accounts" [value]="account.id">
          {{ account.accountNumber }}
        </option>
      </select>
    </div>
    <div class="form-group mr-3">
      <label for="startDate" class="mr-2">
        <i class="fas fa-calendar-alt"></i> From
      </label>
      <input id="startDate" type="date" class="form-control" [(ngModel)]="startDate" name="startDate">
    </div>
    <div class="form-group mr-3">
      <label for="endDate" class="mr-2">
        <i class="fas fa-calendar-alt"></i> To
      </label>
      <input id="endDate" type="date" class="form-control" [(ngModel)]="endDate" name="endDate">
    </div>
    <button type="submit" class="btn btn-primary">
      <i class="fas fa-search"></i> Filter
    </button>
  </form>

  <!-- Error Alert -->
  <div *ngIf="errorMessage" class="alert alert-danger">
    <i class="fas fa-exclamation-triangle"></i> {{ errorMessage }}
  </div>

  <!-- Transactions Table -->
  <div *ngIf="transactions && transactions.length > 0; else noTransactions">
    <table class="table table-striped table-hover">
      <thead class="thead-dark">
        <tr>
          <th><i class="fas fa-calendar-alt"></i> Date</th>
          <th><i class="fas fa-exchange-alt"></i> Type</th>
          <th><i class="fas fa-money-bill-wave"></i> Amount</th>
          <th><i class="fas fa-info-circle"></i> Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let tx of transactions">
          <td>{{ tx.date | date:'short' }}</td>
          <td>{{ tx.type }}</td>
          <td>{{ tx.amount | currency }}</td>
          <td>{{ tx.status }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- No Transactions Template -->
  <ng-template #noTransactions>
    <div class="alert alert-info">
      <i class="fas fa-info-circle"></i> No transactions found for the selected criteria.
    </div>
  </ng-template>
</div>
