<div class="container d-flex flex-column justify-content-center align-items-center my-5">
    <div class="card shadow-lg forgot-password-card">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4">
          <i class="fas fa-unlock-alt me-2"></i>Forgot Password
        </h3>
  
        <form (ngSubmit)="onSubmit()" #forgotPasswordForm="ngForm">
          <!-- Email Field -->
          <div class="mb-3">
            <label for="email" class="form-label"
              >Email <i class="fas fa-envelope"></i></label
            >
            <input
              type="email"
              id="email"
              [(ngModel)]="email"
              name="email"
              class="form-control"
              placeholder="Enter your registered email"
              required
            />
          </div>
  
          <!-- Submit Button -->
          <button
            type="submit"
            class="btn btn-primary w-100"
            [disabled]="!forgotPasswordForm.form.valid"
          >
            <i class="fas fa-paper-plane me-2"></i>Send Reset Link
          </button>
        </form>
  
        <!-- Error & Success Messages -->
        <div *ngIf="errorMessage" class="alert alert-danger mt-3">
          {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="alert alert-success mt-3">
          {{ successMessage }}
        </div>
      </div>
    </div>
  </div>
