<div class="container d-flex flex-column justify-content-center align-items-center my-5">
  <div class="card shadow-lg login-card">
    <div class="card-body p-4">
      <h3 class="card-title text-center mb-4">
        <i class="fas fa-sign-in-alt me-2"></i>Login
      </h3>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label"
            >Email <i class="fas fa-envelope"></i
          ></label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            class="form-control"
            placeholder="Enter your email"
            required
          />
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label"
            >Password <i class="fas fa-lock"></i
          ></label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            class="form-control"
            placeholder="Enter your password"
            required
          />
        </div>

        <!-- Remember Me -->
        <div class="mb-3 form-check">
          <input
            type="checkbox"
            id="rememberMe"
            [(ngModel)]="rememberMe"
            name="rememberMe"
            class="form-check-input"
          />
          <label class="form-check-label" for="rememberMe">
            Remember Me
          </label>
        </div>

        <!-- Buttons & Links -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="!loginForm.form.valid"
          >
            <i class="fas fa-paper-plane me-2"></i>Submit
          </button>
          <a routerLink="/forgot-password" class="text-decoration-none">
            Forgot Password?
          </a>
        </div>

        <div class="text-center">
          Not yet registered?
          <a routerLink="/register" class="text-decoration-none"
            >Create an account</a
          >
        </div>
      </form>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="alert alert-danger mt-3">
        {{ errorMessage }}
      </div>
    </div>
  </div>
</div>
