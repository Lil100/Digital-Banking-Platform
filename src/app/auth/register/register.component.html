<div class="container d-flex flex-column justify-content-center align-items-center my-5">
  <div class="card shadow-lg register-card">
    <div class="card-body p-4">
      <h3 class="card-title text-center mb-4">
        <i class="fas fa-user-plus me-2"></i>Register
      </h3>

      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <div class="mb-3">
          <label for="fullName" class="form-label"
            >Full Name <i class="fas fa-user"></i></label>
          <input
            type="text"
            id="fullName"
            [(ngModel)]="fullName"
            name="fullName"
            class="form-control"
            placeholder="Enter your Full Name"
            required
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label"
            >Email <i class="fas fa-envelope"></i></label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            class="form-control"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label"
            >Password <i class="fas fa-lock"></i></label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            class="form-control"
            placeholder="Enter your password"
            required
          />
        </div>

        <!-- Uncommented Phone field for customer registrations -->
        <div class="mb-3">
          <label for="phone" class="form-label"
            >Phone <i class="fas fa-phone"></i></label>
          <input
            type="text"
            id="phone"
            [(ngModel)]="phone"
            name="phone"
            class="form-control"
            placeholder="Enter your phone number"
          />
        </div>

        <div class="mb-3">
          <label for="role" class="form-label"
            >Role <i class="fas fa-user-tag"></i></label>
          <select
            id="role"
            [(ngModel)]="role"
            name="role"
            class="form-select"
            required
          >
            <option value="CUSTOMER">CUSTOMER</option>
            <option value="ADMIN">ADMIN</option>
          </select>
        </div>

        <button
          type="submit"
          class="btn btn-success w-100"
          [disabled]="!registerForm.form.valid"
        >
          <i class="fas fa-user-plus me-2"></i>Sign Up
        </button>
      </form>

      <!-- Error & Success Messages -->
      <div *ngIf="errorMessage" class="alert alert-danger mt-3">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="alert alert-success mt-3">
        {{ successMessage }}
      </div>

      <div class="text-center mt-3">
        Already registered?
        <a routerLink="/login" class="text-decoration-none">Login here</a>
      </div>
    </div>
  </div>
</div>
