<div class="audit-logs-container">
    <h2>Audit Logs</h2>
    <div class="search-bar">
      <input type="text" [(ngModel)]="searchQuery" placeholder="Search logs..." class="form-control" />
      <button class="btn btn-primary" (click)="onSearch()">
        <i class="fas fa-search"></i> Search
      </button>
    </div>
    <table class="table table-striped table-hover mt-3">
      <thead>
        <tr>
          <th>ID</th>
          <th>Action</th>
          <th>User</th>
          <th>Timestamp</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of logs">
          <td>{{ log.id }}</td>
          <td>{{ log.action }}</td>
          <td>{{ log.user }}</td>
          <td>{{ log.timestamp | date:'short' }}</td>
          <td>{{ log.details }}</td>
        </tr>
      </tbody>
    </table>
  </div>
