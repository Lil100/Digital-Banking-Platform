<div class="accounts-container">
  <h2>Manage Bank Accounts</h2>

  <!-- Add New Account Button -->
  <div class="mb-3 text-end">
    <button class="btn btn-success" (click)="openAccountForm()">
      <i class="fas fa-plus"></i> Add New Account
    </button>
  </div>

  <table class="table table-striped table-hover table-responsive">
    <thead>
      <tr>
        <th>#</th>
        <th>Account Number</th>
        <th>Customer ID</th>
        <th>Balance</th>
        <th>Status</th>
        <th>Created At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let account of accounts; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ account.accountNumber }}</td>
        <td>{{ account.customerId }}</td>
        <td>{{ account.balance | currency }}</td>
        <td>
          <!-- Show different badge colors for each status -->
          <span
            [ngClass]="{
              'badge bg-success': account.status === 'ACTIVE',
              'badge bg-warning': account.status === 'FROZEN',
              'badge bg-secondary': account.status === 'CLOSED'
            }"
          >
            {{ account.status }}
          </span>
        </td>
        <!-- Display createdAt if provided by the backend -->
        <td>{{ account.createdAt | date:'short' }}</td>
        <td>
          <div class="btn-group">
            <!-- Freeze/Unfreeze Button -->
            <button
              class="btn btn-warning btn-sm"
              (click)="freezeUnfreezeAccount(account)"
            >
              <i
                class="fas"
                [ngClass]="{
                  'fa-lock': account.status === 'ACTIVE',
                  'fa-unlock': account.status === 'FROZEN'
                }"
              ></i>
              {{ account.status === 'ACTIVE' ? 'Freeze' : 'Unfreeze' }}
            </button>

            <!-- Edit Account Button -->
            <button
              class="btn btn-info btn-sm"
              (click)="openAccountForm(account)"
            >
              <i class="fas fa-edit"></i> Edit
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
