<div class="transaction-filter-container">
    <h2>Search Transactions</h2>
    <form [formGroup]="filterForm" (ngSubmit)="onSearch()">
      <div class="row">
        <div class="form-group col-md-3">
          <label>Start Date</label>
          <input type="date" formControlName="startDate" class="form-control" />
        </div>
        <div class="form-group col-md-3">
          <label>End Date</label>
          <input type="date" formControlName="endDate" class="form-control" />
        </div>
        <div class="form-group col-md-3">
          <label>Transaction Type</label>
          <select formControlName="transactionType" class="form-control">
            <option value="ALL">All</option>
            <option value="DEPOSIT">Deposit</option>
            <option value="WITHDRAW">Withdraw</option>
            <option value="TRANSFER">Transfer</option>
          </select>
        </div>
        <div class="form-group col-md-3">
          <label>Amount Range</label>
          <div class="d-flex">
            <input type="number" formControlName="amountMin" class="form-control" placeholder="Min" />
            <span class="mx-2">-</span>
            <input type="number" formControlName="amountMax" class="form-control" placeholder="Max" />
          </div>
        </div>
      </div>
      <div class="text-center mt-3">
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-search"></i> Search
        </button>
      </div>
    </form>
  
    <div class="mt-4" *ngIf="loading">
      <p>Loading transactions...</p>
    </div>
  
    <div *ngIf="!loading && transactions.length > 0" class="table-responsive mt-4">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>#</th>
            <th>ID</th>
            <th>Customer</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let tx of transactions; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ tx.id }}</td>
            <td>{{ tx.customerName }}</td>
            <td>{{ tx.amount | currency }}</td>
            <td>{{ tx.type }}</td>
            <td>{{ tx.date | date:'short' }}</td>
            <td>{{ tx.status }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <div *ngIf="!loading && transactions.length === 0" class="text-center mt-4">
      <p>No transactions found.</p>
    </div>
  </div>
