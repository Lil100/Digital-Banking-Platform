<div class="container-fluid">
  <h4 class="mb-3 text-center">
    <i class="fas" [ngClass]="customer ? 'fa-user-edit' : 'fa-user-plus'"></i>
    {{ customer ? 'Edit Customer' : 'Add Customer' }}
  </h4>

  <form [formGroup]="customerForm" (ngSubmit)="submitForm()">
    <div class="form-row">
      <!-- Name -->
      <div class="form-group col-md-6">
        <label for="name"><i class="fas fa-user"></i> Name</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          class="form-control"
          placeholder="Enter name"
        />
        <div
          *ngIf="customerForm.get('name')?.invalid && customerForm.get('name')?.touched"
          class="text-danger"
        >
          Name is required.
        </div>
      </div>

      <!-- Email -->
      <div class="form-group col-md-6">
        <label for="email"><i class="fas fa-envelope"></i> Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="form-control"
          placeholder="Enter email"
        />
        <div
          *ngIf="customerForm.get('email')?.invalid && customerForm.get('email')?.touched"
          class="text-danger"
        >
          Enter a valid email.
        </div>
      </div>
    </div>

    <div class="form-row">
      <!-- Phone -->
      <div class="form-group col-md-6">
        <label for="phone"><i class="fas fa-phone"></i> Phone</label>
        <input
          id="phone"
          type="text"
          formControlName="phone"
          class="form-control"
          placeholder="Enter phone"
        />
        <div
          *ngIf="customerForm.get('phone')?.invalid && customerForm.get('phone')?.touched"
          class="text-danger"
        >
          Phone is required.
        </div>
      </div>

      <!-- Address -->
      <div class="form-group col-md-6">
        <label for="address"><i class="fas fa-map-marker-alt"></i> Address</label>
        <input
          id="address"
          type="text"
          formControlName="address"
          class="form-control"
          placeholder="Enter address"
        />
        <div
          *ngIf="customerForm.get('address')?.invalid && customerForm.get('address')?.touched"
          class="text-danger"
        >
          Address is required.
        </div>
      </div>
    </div>

    <div class="form-row">
      <!-- Password -->
      <div class="form-group col-md-6">
        <label for="password"><i class="fas fa-lock"></i> Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-control"
          placeholder="Enter password"
        />
        <div
          *ngIf="customerForm.get('password')?.invalid && customerForm.get('password')?.touched"
          class="text-danger"
        >
          Password is required (min 6 characters).
        </div>
      </div>

      <!-- Status -->
      <div class="form-group col-md-6">
        <label for="status"><i class="fas fa-check-circle"></i> Status</label>
        <select
          id="status"
          formControlName="status"
          class="form-control"
        >
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    </div>

    <button type="submit" class="btn btn-primary">
      <i class="fas fa-save"></i>
      {{ customer ? 'Update Customer' : 'Add Customer' }}
    </button>
  </form>
</div>
