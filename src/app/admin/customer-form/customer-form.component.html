<form [formGroup]="customerForm" (ngSubmit)="submitForm()">
    <div class="form-group">
      <label>Name</label>
      <input type="text" formControlName="name" class="form-control" placeholder="Enter name" />
      <div *ngIf="customerForm.get('name')?.invalid && customerForm.get('name')?.touched" class="text-danger">
        Name is required.
      </div>
    </div>
  
    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" class="form-control" placeholder="Enter email" />
      <div *ngIf="customerForm.get('email')?.invalid && customerForm.get('email')?.touched" class="text-danger">
        Enter a valid email.
      </div>
    </div>
  
    <div class="form-group">
      <label>Phone</label>
      <input type="text" formControlName="phone" class="form-control" placeholder="Enter phone" />
      <div *ngIf="customerForm.get('phone')?.invalid && customerForm.get('phone')?.touched" class="text-danger">
        Phone is required.
      </div>
    </div>
  
    <div class="form-group">
      <label>Status</label>
      <select formControlName="status" class="form-control">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
  
    <button type="submit" class="btn btn-primary">
      <i class="fas fa-save"></i> {{ customer ? 'Update' : 'Add' }} Customer
    </button>
  </form>
