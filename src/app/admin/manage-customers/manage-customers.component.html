<div class="customers-container">
  <h2>Manage Customers</h2>
  <button class="btn btn-success mb-3" (click)="openCustomerForm()">
    <i class="fas fa-plus"></i> Add New Customer
  </button>
  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Customer ID</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let customer of customers; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ customer.name }}</td>
        <td>{{ customer.email }}</td>
        <td>{{ customer.phone }}</td>
        <td>
          <span [class.active]="customer.status === 'active'" [class.inactive]="customer.status !== 'active'">
            {{ customer.id }}
          </span>
        </td>
        <td>
          <button class="btn btn-info btn-sm" (click)="viewCustomer(customer)">
            <i class="fas fa-eye"></i> View
          </button>
          <button class="btn btn-warning btn-sm" (click)="updateCustomer(customer)">
            <i class="fas fa-edit"></i> Edit
          </button>
          <button class="btn btn-danger btn-sm" (click)="deactivateCustomer(customer.id)">
            <i class="fas fa-ban"></i> Deactivate
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Customer Details Modal (if already implemented) -->
<app-customer-details-modal
  *ngIf="selectedCustomer"
  [customer]="selectedCustomer"
  (closeModal)="closeModal()">
</app-customer-details-modal>
