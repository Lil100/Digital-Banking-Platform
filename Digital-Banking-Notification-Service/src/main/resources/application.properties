# Application Name
spring.application.name=Digital-Banking-Notification-Service

# Server Configuration
server.port=9085

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.enabled=true

# Spring Cloud Compatibility
spring.cloud.compatibility-verifier.enabled=false

# Database Configuration (MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3306/digital_banking_notification_service
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging Configuration
# Enables security-related debug logs
logging.level.org.springframework.security=DEBUG

# SMTP Configuration (For Email Notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}  # Use environment variables for security
spring.mail.password=${MAIL_PASSWORD}  # Avoid hardcoding passwords
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
