spring.application.name=Digital-Banking-ApiGateway

server.port=

eureka.client.service-url.service.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.routes[0].id=Digital_Banking_Audit_Logging_Service
spring.cloud.gateway.routes[0].uri=http://localhost:9091
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/audit/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[1].id=Digital_Banking_User_Service
spring.cloud.gateway.routes[1].uri=http://localhost:9090
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/user/**

spring.cloud.gateway.routes[2].id=TransactionService
spring.cloud.gateway.routes[2].uri=http://localhost:9084
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/transactions/**

spring.cloud.gateway.routes[3].id=AccountService
spring.cloud.gateway.routes[3].uri=http://localhost:9083
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/accounts/**

spring.cloud.gateway.routes[4].id=AccountService
spring.cloud.gateway.routes[4].uri=http://localhost:9083
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/customers/**

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER



